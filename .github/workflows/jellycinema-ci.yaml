name: Jelly Cinema / Build and privacy check

# Every push and pull request: build the app, run the unit tests and the privacy check.
# Also used by the release workflow before it publishes anything.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: Build, tests and privacy check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .tools-versions

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Start a throwaway Jellyfin server
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p "$RUNNER_TEMP/media"
          docker run -d --name jellyfin -p 8096:8096 -v "$RUNNER_TEMP/media:/media" jellyfin/jellyfin:latest
          for i in $(seq 90); do curl -fs http://localhost:8096/System/Info/Public && break; sleep 2; done

      - name: Add sample movies, libraries and restricted accounts
        run: python3 ci/privacy/seed.py http://localhost:8096 "$RUNNER_TEMP/media" /media

      - name: Unit tests and privacy check
        env:
          JC_PRIVACY_ACCOUNTS: ${{ runner.temp }}/media/accounts.json
        run: ./gradlew :app:testDebugUnitTest

      - name: Build the app (unsigned)
        run: ./gradlew :app:assembleRelease

      - name: Upload the unsigned app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jellycinema-tv-unsigned
          retention-days: 14
          if-no-files-found: error
          path: app/build/outputs/apk/release/*.apk

      - name: Server log (when something failed)
        if: failure()
        run: docker logs jellyfin | tail -200
